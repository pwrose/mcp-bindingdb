[project]
name = "mcp-bindingdb"
version = "0.1.0"
description = "MCP server for querying BindingDB from a local DuckDB build"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
    "duckdb>=1.1",
    "mcp[cli]>=2.3.0",
]

[project.scripts]
mcp-bindingdb = "mcp_bindingdb.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_bindingdb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
