[project]
name = "mcp-bindingdb"
version = "0.1.0"
description = "MCP server for querying BindingDB from a local DuckDB build"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
    "duckdb>=1.1",
    "mcp[cli]>=2.3.0",
]

[project.optional-dependencies]
substructure = ["rdkit>=2024.3"]
name = ["pyopsin>=1.1.0"]  # OPSIN IUPAC-name parser; needs a Java runtime

[project.scripts]
mcp-bindingdb = "mcp_bindingdb.server:main"

[dependency-groups]
dev = [
    "pyopsin>=1.1.0",
    "pytest>=8",
    "rdkit>=2024.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_bindingdb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access (PubChem); deselect with -m 'not network'"]
